<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Préstamo de Libros | Biblioteca Pascual Bravo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* Colores De la pagina en general */
        :root {
            --azul: #0b2a6f;
            --azul-oscuro: #071c4d;
            --azul-claro: #e8eefb;
            --acento: #de0000;
            --fondo: #f3f6fb;
            --tarjeta: #ffffff;
            --texto: #0f172a;
            --texto-suave: #64748b;
            --borde: #cbd5e1;
            --radio: 12px;
            --sombra: 0 10px 25px -8px rgba(11, 42, 111, .18);
        }

        /* Aqui estan las diferentes variables para darle la forma,tipo de letra,espacio etc.. del formulario */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--fondo);
            color: var(--texto);
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Variables de la barra superior */
        .navbar {
            background: linear-gradient(135deg, var(--azul-oscuro), var(--azul));
            border-bottom: 4px solid var(--acento);
            color: #fff;
            padding: .9rem 1rem;
        }
        .navbar__inner {
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            gap: .9rem;
        }
       /* Logo, esto esta aqui para la modificación del tamaño del logo y el espacio que este va a ocupar */
        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            height: 50px;
        }
        .logo {
            height: 100%;
            width: auto;
            max-width: 180px;
            object-fit: contain;
            display: block;
        }

        .brand { display: flex; flex-direction: column; justify-content: center; }
        .brand__name { font-size: 1.15rem; font-weight: 800; letter-spacing: .02em; line-height: 1.15; }
        .brand__sub  { font-size: .8rem; opacity: .85; }

        /*Contenido: Botones */
        .main {
            flex: 1;
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            padding: 1.5rem 1rem 2rem;
            display: grid;
            gap: 1.5rem;
        }
        .card {
            background: var(--tarjeta);
            border-radius: var(--radio);
            box-shadow: var(--sombra);
            border: 1px solid #e2e8f0;
            padding: clamp(1.1rem, 4vw, 2.2rem);
        }
        .card__head { text-align: center; margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: 2px solid var(--azul-claro); }
        .card__head h1, .card__head h2 { color: var(--azul); font-size: clamp(1.25rem, 3.5vw, 1.7rem); }
        .card__head p { color: var(--texto-suave); font-size: .92rem; margin-top: .25rem; }

        .section-title {
            color: var(--azul);
            font-size: .85rem;
            text-transform: uppercase;
            letter-spacing: .06em;
            font-weight: 700;
            margin: 1.6rem 0 .9rem;
            padding-bottom: .4rem;
            border-bottom: 1px solid var(--borde);
        }

        /* ========== 5. FORMULARIO ========== */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem 1.25rem;
        }
        .span-2 { grid-column: span 2; }
        .field { display: flex; flex-direction: column; min-width: 0; }
        .field label { font-size: .85rem; font-weight: 600; color: #334155; margin-bottom: .35rem; }

        input[type="text"], input[type="tel"], input[type="email"], input[type="date"], select, textarea {
            width: 100%;
            padding: .7rem .85rem;
            font: inherit;
            font-size: 1rem; /* 16px evita el zoom automático en iPhone */
            border: 1px solid var(--borde);
            border-radius: 8px;
            background: #f8fafc;
            color: var(--texto);
            transition: border-color .2s, box-shadow .2s, background .2s;
        }
        textarea { resize: vertical; min-height: 80px; }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--azul);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(11, 42, 111, .18);
        }
        select optgroup { font-weight: 700; color: var(--azul); }
        select option   { font-weight: 400; color: var(--texto); }

        fieldset { border: 1px solid var(--borde); border-radius: 8px; padding: .8rem 1rem; background: #f8fafc; }
        legend { font-size: .85rem; font-weight: 600; padding: 0 .4rem; }
        .options { display: flex; flex-wrap: wrap; gap: .6rem 1.5rem; }
        .option { display: inline-flex; align-items: center; gap: .5rem; font-size: .92rem; cursor: pointer; }
        .option input { accent-color: var(--azul); width: 18px; height: 18px; }

        .btn {
            width: 100%;
            margin-top: 1.5rem;
            padding: .95rem;
            border: 0;
            border-radius: 8px;
            background: var(--azul);
            color: #fff;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
            transition: background .2s, transform .1s;
        }
        .btn:hover  { background: var(--azul-oscuro); }
        .btn:active { transform: scale(.99); }

        .alert {
            display: none;
            background: #d1fae5;
            border: 1px solid #10b981;
            color: #065f46;
            padding: .9rem 1rem;
            border-radius: 8px;
            margin-bottom: 1.2rem;
        }

        /* ========== 6. TABLA DE PRÉSTAMOS ========== */
        .records__head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: .8rem; margin-bottom: 1rem; }
        .records__head h2 { color: var(--azul); font-size: 1.2rem; }
        .filter { display: flex; align-items: center; gap: .5rem; font-size: .85rem; }
        .filter select { padding: .45rem .6rem; font-size: .9rem; width: auto; }

        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: .88rem; text-align: left; }
        th { background: var(--azul-claro); color: var(--azul); padding: .7rem .6rem; font-weight: 700; }
        td { padding: .7rem .6rem; border-bottom: 1px solid #e2e8f0; }
        .badge { background: var(--azul-claro); color: var(--azul); padding: 2px 9px; border-radius: 999px; font-weight: 600; font-size: .75rem; white-space: nowrap; }
        .empty { text-align: center; color: var(--texto-suave); padding: 1.5rem .6rem; }

        /* ========== 7. PIE ========== */
        .footer { background: var(--azul-oscuro); color: #b6c3e0; text-align: center; padding: 1.1rem 1rem; font-size: .82rem; }

        /* ========== 8. RESPONSIVE ========== */
        @media (max-width: 680px) {
            .form-grid { grid-template-columns: 1fr; }
            .span-2 { grid-column: auto; }
            .logo { height: 40px; width: auto; }
            .brand__name { font-size: 1rem; }
            .filter, .filter select { width: 100%; }

            /* La tabla se convierte en tarjetas apiladas */
            thead { display: none; }
            table, tbody, tr, td { display: block; width: 100%; }
            tr { border: 1px solid #e2e8f0; border-radius: 8px; margin-bottom: .8rem; padding: .4rem .2rem; }
            td { border: 0; display: flex; justify-content: space-between; gap: 1rem; padding: .35rem .7rem; text-align: right; }
            td::before { content: attr(data-label); font-weight: 600; color: var(--texto-suave); text-align: left; }
            td.empty { display: block; text-align: center; }
            td.empty::before { content: none; }
        }
    </style>
</head>
<body>

    <!-- Header en el que esta ubicado el logo y una pequeña información de la institución -->
    <header class="navbar">
        <div class="navbar__inner">
            <div class="logo-container">
                <img src="images/Logo.png" class="logo" alt="Logo Pascual Bravo" onerror="console.warn('Verifica que la imagen esté en images/Logo.png')">
            </div>
            
            <div class="brand">
                <div class="brand__name">PASCUAL BRAVO</div>
                <div class="brand__sub">I.T.I. Pascual Bravo · Biblioteca · Préstamo de libros</div>
            </div>
        </div>
    </header>

    <main class="main">

        <!--Estructura del formulario -->
        <section class="card">
            <div class="card__head">
                <h1>Formulario de Préstamo de Libros</h1>
                
            </div>

            <div id="alertSuccess" class="alert" role="status">
                <strong>¡Préstamo registrado!</strong> Ya aparece en la lista de abajo.
            </div>

            <form id="loanForm">
                <h3 class="section-title">1. Datos del solicitante</h3>
                <div class="form-grid">
                    <div class="field">
                        <label for="documento">Documento de identidad *</label>
                        <input type="text" id="documento" name="documento" inputmode="numeric" placeholder="Ej. 1017283940" required>
                    </div>
                    <div class="field">
                        <label for="nombre">Nombres y apellidos *</label>
                        <input type="text" id="nombre" name="nombre" placeholder="Ej. Carlos Mario Pérez" required>
                    </div>
                    <div class="field span-2">
                        <label for="grado">Nivel académico y grado *</label>
                        <select id="grado" name="grado" required>
                            <option value="" disabled selected>Seleccione el grado…</option>
                            <optgroup label="Bachillerato básico">
                                <option>Grado 6°</option><option>Grado 7°</option><option>Grado 8°</option>
                            </optgroup>
                            <optgroup label="Bachillerato superior">
                                <option>Grado 9°</option><option>Grado 10°</option><option>Grado 11°</option>
                            </optgroup>
                            <optgroup label="Personal institucional">
                                <option>Docente</option><option>Administrativo</option>
                            </optgroup>
                        </select>
                    </div>
                    <div class="field">
                        <label for="celular">Celular de contacto *</label>
                        <input type="tel" id="celular" name="celular" inputmode="tel" placeholder="Ej. 3001234567" required>
                    </div>
                    <div class="field">
                        <label for="correo">Correo electrónico *</label>
                        <input type="email" id="correo" name="correo" placeholder="estudiante@pascualbravo.edu.co" required>
                    </div>
                </div>

                <h3 class="section-title">2. Datos del libro</h3>
                <div class="form-grid">
                    <div class="field span-2">
                        <label for="titulo">Título del libro *</label>
                        <input type="text" id="titulo" name="titulo" placeholder="Ej. Cien años de soledad" required>
                    </div>
                    <div class="field span-2">
                        <label for="categoria">Categoría / área temática *</label>
                        <select id="categoria" name="categoria" required>
                            <option value="" disabled selected>Seleccione el área…</option>
                            <option>Literatura y Lenguaje</option>
                            <option>Matemáticas y Física</option>
                            <option>Ciencias Naturales y Química</option>
                            <option>Tecnología e Informática</option>
                            <option>Sociales e Historia</option>
                            <option>Filosofía e Ética</option>
                            <option>Otra área</option>
                        </select>
                    </div>
                </div>

                <h3 class="section-title">3. Modalidad y fechas</h3>
                <fieldset>
                    <legend>Tipo de préstamo *</legend>
                    <div class="options">
                        <label class="option"><input type="radio" name="tipo" value="casa" id="tipoCasa" checked> Para llevar a casa (7 días)</label>
                        <label class="option"><input type="radio" name="tipo" value="sala" id="tipoSala"> Lectura en sala (mismo día)</label>
                    </div>
                </fieldset>

                <div class="form-grid" style="margin-top:1rem">
                    <div class="field">
                        <label for="fechaPrestamo">Fecha de préstamo *</label>
                        <input type="date" id="fechaPrestamo" name="fechaPrestamo" required>
                    </div>
                    <div class="field">
                        <label for="fechaDevolucion">Fecha máxima de devolución *</label>
                        <input type="date" id="fechaDevolucion" name="fechaDevolucion" required>
                    </div>
                    <div class="field span-2">
                        <label for="observaciones">Observaciones / estado del ejemplar</label>
                        <textarea id="observaciones" name="observaciones" placeholder="Ej. Buen estado, pasta dura."></textarea>
                    </div>
                </div>

                <button type="submit" class="btn">Registrar préstamo</button>
            </form>
        </section>
    <footer class="footer">
        &copy; 2026 I.T.I Pascual Bravo · Biblioteca
    </footer>

    <script>
(() => {
    'use strict';

    // ⚠️ Pega aquí la URL del Paso 3
    const URL_SCRIPT = 'https://script.google.com/macros/s/AKfycbwxONRtzuE91eIzhfpbfFLtrl24hJpltRDyQsCKyZdcguZgNlS3k6DgB5wQ6y0BbuYruQ/exec';

    const $ = (id) => document.getElementById(id);
    const form = $('loanForm');
    const alerta = $('alertSuccess');
    const boton = form.querySelector('button[type="submit"]');
    const fechaPrestamo = $('fechaPrestamo');
    const fechaDevolucion = $('fechaDevolucion');
    const tipoSala = $('tipoSala');

    const formatoFecha = (d) =>
        `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    const hoy = () => formatoFecha(new Date());

    function actualizarDevolucion() {
        if (!fechaPrestamo.value) return;
        const f = new Date(fechaPrestamo.value + 'T00:00:00');
        if (!tipoSala.checked) f.setDate(f.getDate() + 7);
        fechaDevolucion.value = formatoFecha(f);
    }

    function mostrar(mensaje, ok) {
        alerta.innerHTML = mensaje;
        alerta.style.background = ok ? '#d1fae5' : '#fee2e2';
        alerta.style.borderColor = ok ? '#10b981' : '#ef4444';
        alerta.style.color = ok ? '#065f46' : '#991b1b';
        alerta.style.display = 'block';
        alerta.scrollIntoView({ behavior: 'smooth', block: 'center' });
        setTimeout(() => (alerta.style.display = 'none'), 5000);
    }

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        boton.disabled = true;
        boton.textContent = 'Enviando…';

        try {
            await fetch(URL_SCRIPT, {
                method: 'POST',
                mode: 'no-cors',   // Apps Script no permite leer la respuesta desde otro sitio
                body: new URLSearchParams(new FormData(form))
            });
            mostrar('✅ <strong>¡Préstamo registrado!</strong> La bibliotecaria lo verificará.', true);
            form.reset();
            fechaPrestamo.value = hoy();
            actualizarDevolucion();
        } catch (err) {
            mostrar('❌ <strong>No se pudo enviar.</strong> Revisa tu conexión e inténtalo de nuevo.', false);
        } finally {
            boton.disabled = false;
            boton.textContent = 'Registrar préstamo';
        }
    });

    fechaPrestamo.addEventListener('change', actualizarDevolucion);
    document.querySelectorAll('input[name="tipo"]').forEach((r) =>
        r.addEventListener('change', actualizarDevolucion));

    fechaPrestamo.value = hoy();
    actualizarDevolucion();
})();
</script>
</body>
</html>
